name: Build NexusCore
on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Private Code
      uses: actions/checkout@v4
      with:
        repository: zxxzxx1314/NexusCore-Private
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}
        path: NexusCore

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Build Android APK
      run: |
        cd NexusCore
        # 云端自带 gradle，如果没有 gradlew 就用系统自带的生成一个
        if [ ! -f "gradlew" ]; then
          gradle wrapper --gradle-version 8.7
        fi
        chmod +x gradlew
        ./gradlew :app:assembleDebug --no-daemon
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NexusCore-APK
        path: NexusCore/app/build/outputs/apk/debug/*.apk
