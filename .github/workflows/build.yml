name: Build NexusCore
on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Private Code
      uses: actions/checkout@v4
      with:
        repository: zxxzxx1314/NexusCore-Private
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}
        path: NexusCore

    - name: Ensure Gradle Wrapper
      run: |
        cd NexusCore
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          curl -sL "https://services.gradle.org/distributions/gradle-8.7-bin.zip" -o /tmp/gradle.zip
          unzip -p /tmp/gradle.zip "gradle-8.7/lib/plugins/gradle-wrapper-main-8.7.jar" > gradle/wrapper/gradle-wrapper.jar || unzip -p /tmp/gradle.zip "gradle-8.7/lib/gradle-wrapper.jar" > gradle/wrapper/gradle-wrapper.jar
        fi
        chmod +x gradlew || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Build Android APK
      run: |
        cd NexusCore
        if [ ! -f "gradlew" ]; then
          curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew" -o gradlew
          chmod +x gradlew
        fi
        ./gradlew assembleDebug --no-daemon
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NexusCore-APK
        path: NexusCore/app/build/outputs/apk/debug/*.apk
